<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 180" role="img" aria-label="Nokto">
  <title>Nokto</title>
  <defs>
    <linearGradient id="wg" x1="0" y1="0" x2="760" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f0fff4"/>
      <stop offset="1" stop-color="#95BF47"/>
    </linearGradient>
    <linearGradient id="ig" x1="0" y1="0" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#95BF47"/>
      <stop offset="1" stop-color="#B8E05A"/>
    </linearGradient>
    <mask id="a" maskUnits="userSpaceOnUse">
      <rect width="180" height="180" fill="#fff"/>
      <rect x="69" y="51" width="42" height="42" rx="18" fill="#000"/>
    </mask>
    <mask id="b" maskUnits="userSpaceOnUse">
      <rect width="180" height="180" fill="#fff"/>
      <rect x="69" y="87" width="42" height="42" rx="18" fill="#000"/>
