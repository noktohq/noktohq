  </defs>
  <!-- Mark (180×180) -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#000" stroke-opacity=".55" stroke-width="14.7">
      <rect x="33" y="61" width="115" height="59" rx="29" transform="rotate(-28 90 90)"/>
      <rect x="33" y="61" width="115" height="59" rx="29" transform="rotate(28 90 90)"/>
    </g>
    <g stroke="url(#ig)" stroke-width="11.5">
